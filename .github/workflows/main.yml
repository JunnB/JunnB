# Visit https://github.com/lowlighter/metrics/blob/master/action.yml for full reference
name: Metrics
on:
  # Une génération par jour (le rendu prend ~13 min, inutile de le faire 4x/jour)
  schedule: [{cron: "0 4 * * *"}]
  # Lines below let you run workflow manually and on each commit
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: JunnB/metrics@master
        with:
          # Your GitHub token
          # The following scopes are required:
          #  - public_access (default scope)
          # The following additional scopes may be required:
          #  - read:org  (for organization related metrics)
          #  - read:user (for user related data)
          #  - repo      (optional, if you want to include private repositories)
          token: ${{ secrets.METRICS_TOKEN }}

          # Options
          user: JunnB
          template: classic
          base: header, activity, metadata
          config_timezone: Europe/Paris

          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%

          plugin_anilist: yes
          plugin_anilist_limit: 2
          plugin_anilist_medias: anime
          # `characters` retournait une section vide -> on ne garde que `favorites`
          plugin_anilist_sections: favorites
          plugin_anilist_shuffle: yes
          plugin_anilist_user: hypermegajunn

          # Audit de la plateforme principale.
          # Ce plugin renvoyait "PageSpeed Insights API returned 400". Le site
          # étant bien en ligne, le suspect n°1 est le secret PAGESPEED_TOKEN :
          # une clé API invalide ou expirée fait répondre 400. Pour vérifier :
          #   curl -s "https://www.googleapis.com/pagespeedonline/v5/runPagespeed\
          #     ?url=https://betterfolio.tech&key=$PAGESPEED_TOKEN" | head
          plugin_pagespeed: yes
          plugin_pagespeed_detailed: yes
          plugin_pagespeed_screenshot: yes
          plugin_pagespeed_url: https://betterfolio.tech
          plugin_pagespeed_token: ${{ secrets.PAGESPEED_TOKEN }}

          # ── Désactivés : ces plugins rendaient une erreur visible dans l'image ──
          #
          # plugin_habits       -> "An error occured"
          # plugin_achievements -> "An error occured"
          #
          # plugin_lines -> jamais rendu : sa sortie appartient à la section
          #   `repositories`, absente de `base`. Pour l'afficher, ajouter
          #   `repositories` à `base` ci-dessus.
