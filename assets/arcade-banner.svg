<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="JUNN II - Turbo Edition - Insert Coin">
  <title>JUNN II — TURBO EDITION</title>

  <defs>
    <!-- Logo gold, facon marquee SF2 -->
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fffbe6"/>
      <stop offset="28%"  stop-color="#ffe066"/>
      <stop offset="52%"  stop-color="#f9a825"/>
      <stop offset="53%"  stop-color="#e2681a"/>
      <stop offset="100%" stop-color="#a03306"/>
    </linearGradient>

    <linearGradient id="cab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#141a34"/>
      <stop offset="50%"  stop-color="#0a0c1c"/>
      <stop offset="100%" stop-color="#16102a"/>
    </linearGradient>

    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#3b1d6e" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7b2ff7" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Scanlines CRT -->
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" opacity="0.30"/>
    </pattern>

    <!-- Vignette -->
    <radialGradient id="vig" cx="50%" cy="50%" r="72%">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.72"/>
    </radialGradient>

    <clipPath id="screen">
      <rect x="14" y="14" width="872" height="272" rx="18"/>
    </clipPath>

    <style>
      .mono   { font-family: ui-monospace, "SF Mono", "Cascadia Mono", "DejaVu Sans Mono", Menlo, Consolas, monospace; }
      .heavy  { font-family: "Arial Black", "Helvetica Neue", Impact, Arial, sans-serif; font-weight: 900; }

      .logo       { font-size: 104px; letter-spacing: 5px; }
      .logo-back  { fill: #2b0a4d; }
      .logo-edge  { fill: none; stroke: #1b0730; stroke-width: 9; stroke-linejoin: round; }
      .logo-face  { fill: url(#gold); }

      .sub    { font-size: 21px; letter-spacing: 9px; fill: #7fe3ff; }
      .tag    { font-size: 14px; letter-spacing: 3px; fill: #a8bcdd; }
      .coin   { font-size: 17px; letter-spacing: 4px; fill: #ff4d4d; animation: blink 1.1s steps(1) infinite; }
      .credit { font-size: 13px; letter-spacing: 2px; fill: #6c7a94; }
      .site   { font-size: 13px; letter-spacing: 2px; fill: #7fe3ff; }
      .hi     { font-size: 13px; letter-spacing: 2px; fill: #ffd24a; }

      /* Les barres sont statiques : animer `width` laisserait un etat de repos
         incorrect si le moteur de rendu n'execute pas les animations CSS.
         Seule l'opacite est animee, elle degrade proprement. */
      .bar-p1 { fill: #ffd24a; }
      .bar-p2 { fill: #e2503c; }
      .vs     { font-size: 34px; fill: #ff3b30; animation: pulse 1.4s ease-in-out infinite; }

      @keyframes blink { 0%,55% { opacity: 1 } 56%,100% { opacity: 0 } }
      @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .45 } }

      @media (prefers-reduced-motion: reduce) {
        .coin, .vs { animation: none; }
      }
    </style>
  </defs>

  <!-- Cabinet -->
  <rect width="900" height="300" rx="22" fill="#05060d"/>
  <rect x="6" y="6" width="888" height="288" rx="20" fill="none" stroke="#ff3b30" stroke-width="2" opacity="0.55"/>
  <rect x="10" y="10" width="880" height="280" rx="19" fill="none" stroke="#2f7fff" stroke-width="2" opacity="0.45"/>

  <g clip-path="url(#screen)">
    <rect x="14" y="14" width="872" height="272" fill="url(#cab)"/>

    <!-- Grille de sol synthwave -->
    <g stroke="#7b2ff7" stroke-width="1" opacity="0.34">
      <path d="M14 252 H886"/><path d="M14 264 H886"/><path d="M14 286 H886"/>
      <path d="M450 244 L450 286"/><path d="M450 244 L330 286"/><path d="M450 244 L570 286"/>
      <path d="M450 244 L170 286"/><path d="M450 244 L730 286"/>
      <path d="M450 244 L-40 286"/><path d="M450 244 L940 286"/>
    </g>
    <rect x="14" y="244" width="872" height="42" fill="url(#floor)"/>
    <!-- Bandeau sombre pour garder le texte du bas lisible par-dessus la grille -->
    <rect x="14" y="250" width="872" height="30" fill="#05060d" opacity="0.72"/>

    <!-- Barres de vie facon VS screen -->
    <g>
      <rect x="60" y="42" width="304" height="20" rx="3" fill="#101426" stroke="#4a5578" stroke-width="2"/>
      <rect class="bar-p1" x="62" y="44" width="300" height="16" rx="2"/>
      <rect x="536" y="42" width="304" height="20" rx="3" fill="#101426" stroke="#4a5578" stroke-width="2"/>
      <rect class="bar-p2" x="538" y="44" width="74" height="16" rx="2"/>
      <text class="mono hi" x="60" y="34">P1  JUNN</text>
      <text class="mono hi" x="840" y="34" text-anchor="end">P2  LE BUG</text>
      <text class="heavy vs" x="450" y="60" text-anchor="middle">VS</text>
    </g>

    <!-- Logo -->
    <g transform="translate(450 168)">
      <g transform="skewX(-7)" text-anchor="middle">
        <text class="heavy logo logo-back" x="7" y="7">JUNN</text>
        <text class="heavy logo logo-back" x="4" y="4">JUNN</text>
        <text class="heavy logo logo-edge" x="0" y="0">JUNN</text>
        <text class="heavy logo logo-face" x="0" y="0">JUNN</text>
      </g>
    </g>

    <text class="heavy sub" x="450" y="207" text-anchor="middle">II &#183; TURBO EDITION</text>
    <text class="mono tag" x="450" y="234" text-anchor="middle">TYPESCRIPT &#183; NEXT.JS &#183; RUBY &#183; GODOT</text>

    <text class="mono coin"   x="450" y="270" text-anchor="middle">INSERT COIN &#8212; PRESS START</text>
    <text class="mono credit" x="60"  y="270">CREDITS 00</text>
    <text class="mono site" x="840" y="270" text-anchor="end">BETTERFOLIO.TECH</text>

    <rect x="14" y="14" width="872" height="272" fill="url(#scan)"/>
    <rect x="14" y="14" width="872" height="272" fill="url(#vig)"/>
  </g>
</svg>
