    <text class="mono pc" x="762" y="401">0.6 %</text>    <rect x="14" y="14" width="872" height="402" fill="url(#scan)"/>
    <rect x="14" y="14" width="872" height="402" fill="url(#vig)"/>
  </g>
</svg>
